services:
   db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: Unitrade-DB
    ports:
    - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
      DB_NAME: ${DB_NAME}
      USER_ID: ${USER_ID}
    volumes:
    - db_data:/var/opt/mssql
    - ../../database/scripts:/scripts
    - ../../database/seeds:/seeds
    command: /bin/bash -c "/opt/mssql/bin/sqlservr & /scripts/init.sh && wait"

    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
   backend:
    build:
      context: ../../src/backend/Api
      dockerfile: Dockerfile
    container_name: unitrade-backend
    ports:
    - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db;Database=${DB_NAME};User Id=${USER_ID};Password=${APP_USER_PASSWORD};TrustServerCertificate=True"    

    depends_on:
     db: 
       condition: service_healthy
   frontend:
    build:
      context: ../../src/web
      dockerfile: Dockerfile
    container_name: unitrade-web
    ports:
    - "3000:3000"
    depends_on:
     - backend
        

volumes: 
  db_data:

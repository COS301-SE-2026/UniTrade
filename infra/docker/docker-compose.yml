services:
   db:
    image: postgres:18
    container_name: Unitrade-DB
    ports:
    - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${USER_ID}
      POSTGRES_DB: ${DB_NAME}
    volumes:
    - db_data:/var/lib/postgresql/data
    - ../../database/scripts:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_ID} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
   backend:
    build:
      context: ../..
      dockerfile: src/backend/Api/Dockerfile
    container_name: unitrade-backend
    ports:
    - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${DB_NAME};Username=${USER_ID};Password=${POSTGRES_PASSWORD}"    
    depends_on:
     db: 
       condition: service_healthy
   frontend:
    build:
      context: ../../src/web
      dockerfile: Dockerfile
    container_name: unitrade-web
    ports:
    - "3000:3000"
    depends_on:
     - backend
        

volumes: 
  db_data:

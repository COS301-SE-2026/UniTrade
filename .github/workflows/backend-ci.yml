name: Backend CI

on:
  workflow_call:
  push:
    branches-ignore: ["dev", "main"]
    paths:
      - "src/backend/**"
      - ".github/workflows/backend-ci.yml"
 
  pull_request:
    branches: ["dev","main"]
    paths:
      - "src/backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true
jobs:

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: 
          fetch-depth: 0

      - name: Install Gitleaks 
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o gitleaks.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin 

      - name: Run Gitleaks scan
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --redact



  build-and-test:
    needs: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: cipass
          POSTGRES_USER: ciuser
          POSTGRES_DB: unitrade_test_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            src/backend/Api/packages.lock.json
            src/backend/Infrastructure/packages.lock.json
            src/backend/Modules/packages.lock.json
            src/backend/Tests/packages.lock.json

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore dependencies
        run: dotnet restore UniTrade.sln
      
      - name: Start SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
          /k:"COS301-SE-2026_UniTrade" \
          /o:"cos301-se-2026" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /d:sonar.exclusions="**/database/**/*.sql,**/Migrations/**" \
          /d:sonar.cs.opencover.reportsPaths="src/backend/Tests/TestResults/**/coverage.opencover.xml"
        
         
      - name: Build solution
        run: dotnet build UniTrade.sln --configuration Release --no-restore

      - name: Run Unit Tests with Coverage
        working-directory: src/backend/Tests
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage;Format=opencover" --logger "console;verbosity=normal" --filter "Category=Unit" 

      - name: Run Integration Tests
        working-directory: src/backend/Tests
        run: dotnet test --configuration Release --no-build  --collect:"XPlat Code Coverage;Format=opencover" --logger "console;verbosity=normal" --filter "Category=Integration" 
      
      - name: End SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end

  code-quality:
    needs: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            src/backend/Api/packages.lock.json
            src/backend/Infrastructure/packages.lock.json
            src/backend/Modules/packages.lock.json
            src/backend/Tests/packages.lock.json
      - name: Set up Java 21 for SonarScanner
        uses: actions/setup-java@v4
        with:
         java-version: '21'
         distribution: 'temurin'
      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore dependencies
        run: dotnet restore UniTrade.sln
      
      - name: Check code formatting
        run: dotnet format --verify-no-changes --no-restore src/backend/Api/Api.csproj

      - name: Analyze code style
        run: dotnet build src/backend/Api/Api.csproj --configuration Release --no-restore /p:EnforceCodeStyleInBuild=true

      - name: Validate backend docker image
        run: docker build -f src/backend/Api/Dockerfile -t unitrade-backend-ci .

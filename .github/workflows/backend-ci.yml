name: Backend CI

on:
  workflow_call:
  push:
    branches-ignore: ["dev", "main", "feature/backend/SmartBudget"]
    paths:
      - "src/backend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches: ["dev", "main"]
    paths:
      - "src/backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -fSL --proto '=https' https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o gitleaks.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin

      - name: Run Gitleaks scan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gitleaks detect \
              --source . \
              --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
              --config .gitleaks.toml \
              --verbose \
              --redact
          else
            gitleaks detect \
              --source . \
              --log-opts="${{ github.event.before }}..${{ github.sha }}" \
              --config .gitleaks.toml \
              --verbose \
              --redact
          fi

  build-and-test:
    needs: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      Jwt__Secret: ${{ secrets.JWT_SECRET_CI }}

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: cipass
          POSTGRES_USER: ciuser
          POSTGRES_DB: unitrade_test_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            src/backend/Api/packages.lock.json
            src/backend/Infrastructure/packages.lock.json
            src/backend/Modules/packages.lock.json
            src/backend/Tests/packages.lock.json

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore dependencies
        run: dotnet restore UniTrade.sln

      - name: Start SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
          /k:"COS301-SE-2026_UniTrade" \
          /o:"cos301-se-2026" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /d:sonar.exclusions="**/database/**/*.sql,**/Migrations/**,*/node_modules/**,**/build/**,**/*.test.ts,**/*.spec.ts,tests/nfr/evidence/**/*" \
          /d:sonar.cs.opencover.reportsPaths="src/backend/Tests/TestResults/**/coverage.opencover.xml"
      
      - name: Build solution
        run: dotnet build UniTrade.sln --configuration Release --no-restore

      - name: Run Unit Tests with Coverage
        working-directory: src/backend/Tests
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage;Format=opencover" --logger "console;verbosity=normal" --filter "Category=Unit"

      - name: Run Integration Tests
        working-directory: src/backend/Tests
        run: dotnet test --configuration Release --no-build  --collect:"XPlat Code Coverage;Format=opencover" --logger "console;verbosity=normal" --filter "Category=Integration"
      
      - name: Upload backend coverage 
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
            name: backend-coverage
            path: "src/backend/Tests/TestResults/**/coverage.opencover.xml"
            if-no-files-found: ignore
        
      - name: End SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end

  nfr-checks:
    permissions:
      contents: write 
    needs: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: cipass
          POSTGRES_USER: ciuser
          POSTGRES_DB: unitrade_test_ci_nfr_migcheck
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with: { dotnet-version: "10.0.x" }

      - name: Migration apply from empty DB (QR-05b)
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=unitrade_test_ci_nfr_migcheck;Username=ciuser;Password=cipass"
        run: |
          dotnet tool install --global dotnet-ef
          dotnet restore UniTrade.sln
          dotnet ef database update --project src/backend/Infrastructure --startup-project src/backend/Api
      - name: Dependency CVE scan (QR-03e)
        run: |
          set -o pipefail
          dotnet restore UniTrade.sln
          dotnet list package --vulnerable --include-transitive 2>&1 | tee "tests/nfr/evidence/Dependency Audits/dotnet-vulnerability-report.txt"
      
      - name: Upload dotnet CVE report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dotnet-vulnerability-report
          path: "tests/nfr/evidence/Dependency Audits/dotnet-vulnerability-report.txt"
      
      - name: Commit audit report
        if: always() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "tests/nfr/evidence/Dependency Audits/"
          git diff --staged --quiet || git commit -m "QR 3e :update dotnet vulnerability report [skip ci]"
          git push
 
  code-quality:
    permissions:
      contents: write
    needs: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            src/backend/Api/packages.lock.json
            src/backend/Infrastructure/packages.lock.json
            src/backend/Modules/packages.lock.json
            src/backend/Tests/packages.lock.json
      - name: Set up Java 21 for SonarScanner
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore dependencies
        run: dotnet restore UniTrade.sln

      - name: Check code formatting
        run: dotnet format --verify-no-changes --no-restore src/backend/Api/Api.csproj

      - name: Analyze code style
        run: dotnet build src/backend/Api/Api.csproj --configuration Release --no-restore /p:EnforceCodeStyleInBuild=true

      - name: Validate backend docker image
        run: docker build -f src/backend/Api/Dockerfile -t unitrade-backend-ci .

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 
        with:
          image-ref: unitrade-backend-ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
          output: "tests/nfr/evidence/Container Image Scans/trivy-backend.txt"
      
      - name: Upload Trivy backend report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
            name: trivy-backend-report
            path: "tests/nfr/evidence/Container Image Scans/trivy-backend.txt"
            if-no-files-found: ignore

      - name: Commit Trivy report
        if: always() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "tests/nfr/evidence/Container Image Scans/"
          git diff --staged --quiet || git commit -m "QR:update trivy backend report [skip ci]"
          git push

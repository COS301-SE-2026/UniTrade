name: CD - Deploy to Azure

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: cd-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.set_tag.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Login to Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        env:
          ACR: ${{ secrets.ACR_REGISTRY }}
        run: az acr login --name "${ACR%%.*}"

      - name: Set image tag
        id: set_tag
        run: echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Backend image
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}

        run: |
          docker build -t "$ACR_REGISTRY/unitrade-backend:${{github.sha}}" -f src/backend/Api/Dockerfile .
          docker push "$ACR_REGISTRY/unitrade-backend:${{github.sha}}"

      - name: Build and push Frontend image
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: |
          docker build -t "$ACR_REGISTRY/unitrade-frontend:${{ github.sha }}" src/web
          docker push "$ACR_REGISTRY/unitrade-frontend:${{ github.sha }}"
      - name: Build and push CLIP image
        env: 
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }} 
        run: |
          docker build -t "$ACR_REGISTRY/unitrade-clip:${{ github.sha }}" -f src/clip-service/Dockerfile src/clip-service
          docker push "$ACR_REGISTRY/unitrade-clip:${{ github.sha }}"

  deploy-staging:
    permissions:
      id-token: write
      contents: read
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
      BACKEND_RG: rg-devnexus-staging
      FRONTEND_RG: rg-devnexus-staging
      BACKEND_APP: ca-backend-staging
      FRONTEND_APP: ca-frontend-staging
      CLIP_RG: rg-devnexus-staging
      CLIP_APP: ca-clip-staging

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Login to Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "10.0.x"

      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef
      
      - name: restore dependencies
        run: dotnet restore UniTrade.sln
      ##capture first for testing
      - name: Capture last migration
        id: last_migration
        working-directory: src/backend/Api
        env:
          ConnectionStrings__DefaultConnection: ${{secrets.DB_CONNECTION_STRING_STAGING}}
        run:  |
          LAST=$(dotnet ef migrations list --project ../Infrastructure --startup-project . --no-build 2>/dev/null | grep -v '(Pending)' | tail -n 1 | xargs)
          echo "last_migration=$LAST" >> "$GITHUB_OUTPUT"
          echo "Last applied migration: $LAST"
      
      - name: Backup db before migration(staging)
        id: db_backup
        working-directory: src/backend/Api
        env:
          PGCONN: ${{ secrets.DB_CONNECTION_STRING_STAGING}}
        run:  |
          trap 'rm -f ~/.pgpass' EXIT
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

          HOST=$(echo "$PGCONN" | grep -oP '(?i)(?<=Host=)[^;]+')
          PORT=$(echo "$PGCONN" | grep -oP '(?i)(?<=Port=)[^;]+' || echo 5432)
          DBNAME=$(echo "$PGCONN" | grep -oP '(?i)(?<=Database=)[^;]+')
          PGUSER=$(echo "$PGCONN" | grep -oP '(?i)(?<=Username=)[^;]+')
          PGPASS=$(echo "$PGCONN" | grep -oP '(?i)(?<=Password=)[^;]+')

          if [ -z "$HOST" ] || [ -z "$DBNAME" ] || [ -z "$PGUSER" ] || [ -z "$PGPASS" ]; then
            echo "::error:: Failed to parse on or more fields from the connection string.Aborting backup."
            exit 1
          fi

          echo "${HOST}:${PORT}:${DBNAME}:${PGUSER}:${PGPASS}" > ~/.pgpass 
          chmod 600 ~/.pgpass

          pg_dump -h "$HOST" -p "$PORT" -U "$PGUSER" -d "$DBNAME" -Fc -f pre_migration_backup.pg_dump
          DUMP_STATUS=$?

          rm -f ~/.pgpass

          if [ "$DUMP_STATUS" -ne 0 ]; then
            echo "::error::pg_dump failed with exit code $DUMP_STATUS"
            exit 1
          fi

          echo "Backup created successfully."

      - name: Upload db to backup artifact(staging)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-staging-${{ github.sha }}-${{ github.run_attempt }}
          path: src/backend/Api/pre_migration_backup.pg_dump
          retention-days: 30

      - name: Run migrations (staging)
        working-directory: src/backend/Api
        env:
          ConnectionStrings__DefaultConnection: ${{secrets.DB_CONNECTION_STRING_STAGING}}
          #do it the longer way after deploying!
          Acs__ConnectionString: ${{ secrets.Acs__ConnectionString }}
        run: dotnet ef database update --project ../Infrastructure --startup-project .

      
      - name: Capture current live revisions 
        id: live_revs
        run: |
          BACK_LIVE=$(az containerapp revision list \
              --name "$BACKEND_APP" --resource-group "$BACKEND_RG" \
              --query "[?properties.trafficWeight>\`0\`].name | [0]" -o tsv)

              FRONT_LIVE=$(az containerapp revision list \
                --name "$FRONTEND_APP" --resource-group "$FRONTEND_RG" \
                --query "[?properties.trafficWeight>\`0\`].name | [0]" -o tsv)

              echo "backend_live=$BACK_LIVE" >> "$GITHUB_OUTPUT"
              echo "frontend_live=$FRONT_LIVE" >> "$GITHUB_OUTPUT"

              echo "Backend live: ${BACK_LIVE:-<none>}"
              echo "Frontend live: ${FRONT_LIVE:-<none>}"

      - name: Deploy CLIP 
        env: 
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: |
          az containerapp update \
            --name "$CLIP_APP" --resource-group "$CLIP_RG" \
            --image "$ACR_REGISTRY/unitrade-clip:${IMAGE_TAG}"
      
      - name: Get CLIP internal FQDN
        id: clip_fqdn
        run: |
          FQDN=$(az containerapp show \
            --name "$CLIP_APP" --resource-group "$CLIP_RG" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"

      - name: Deploy backend green revision
        id: backend_rev
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          DB_CONN: ${{ secrets.DB_CONNECTION_STRING_STAGING }}
          ACS_CONN: ${{secrets.Acs__ConnectionString}}
          JWT_SECRET: ${{secrets.JWT_Secret}}
          OTP_SECRET: ${{secrets.OTP_SECRET}}
          FIREBASE_CREDS: ${{secrets.FIREBASE_CREDENTIALS}}
          FRONTEND_URL_STAGING: ${{ secrets.FRONTEND_URL_STAGING }}
          ACS_SENDER_ADDRESS: ${{ secrets.ACS_SENDER_ADDRESS }}
          PAYFAST__PASSPHRASE: ${{ secrets.PAYFAST__PASSPHRASE }}          
          PAYFAST__MERCHANTID: ${{ secrets.PAYFAST__MERCHANTID }}          
          PAYFAST__CANCELURL: ${{ secrets.PAYFAST__CANCELURL }}          
          PAYFAST__NOTIFYURL: ${{ secrets.PAYFAST__NOTIFYURL }}          
          PAYFAST__SANDBOXURL: ${{ secrets.PAYFAST__SANDBOXURL }}
          PAYFAST__RETURNURL: ${{ secrets.PAYFAST__RETURNURL }}
          PAYFAST__MERCHANTKEY: ${{ secrets.PAYFAST__MERCHANTKEY }}  
          SIGNALR_CONN: ${{ secrets.SIGNALR_CONN_STRING_STAGING }}
          CLIP_BASE_URL: https://${{ steps.clip_fqdn.outputs.fqdn }}

        run: |
          SUFFIX="g${IMAGE_TAG:0:7}-${{github.run_attempt}}"

          az containerapp secret set \
            --name "$BACKEND_APP" --resource-group "$BACKEND_RG" \
            --secrets \
              "db-conn=$DB_CONN" \
              "acs-conn=$ACS_CONN" \
              "jwt-secret=$JWT_SECRET"  \
              "otp-secret=$OTP_SECRET" \
              "firebase-creds=$(echo "$FIREBASE_CREDS" | jq -c .)" \
              "payfast-passphrase=$PAYFAST__PASSPHRASE" \
              "payfast-merchant-key=$PAYFAST__MERCHANTKEY" \
              "payfast-merchant-id=$PAYFAST__MERCHANTID" \
              "payfast-cancelurl=$PAYFAST__CANCELURL" \
              "payfast-notifyurl=$PAYFAST__NOTIFYURL" \
              "payfast-sandboxurl=$PAYFAST__SANDBOXURL" \
              "payfast-returnurl=$PAYFAST__RETURNURL" \
              "signalr-conn=$SIGNALR_CONN"
          
          az containerapp update \
              --name "$BACKEND_APP" --resource-group "$BACKEND_RG" \
              --image "$ACR_REGISTRY/unitrade-backend:${IMAGE_TAG}" \
              --revision-suffix "$SUFFIX" \
              --set-env-vars \
                "ConnectionStrings__DefaultConnection=secretref:db-conn" \
                "Acs__ConnectionString=secretref:acs-conn" \
                "Jwt__Secret=secretref:jwt-secret" \
                "Otp__Secret=secretref:otp-secret" \
                "Cors__AllowedOrigins=$FRONTEND_URL_STAGING" \
                "Acs__SenderAddress=$ACS_SENDER_ADDRESS" \
                "Firebase__CredentialsJson=secretref:firebase-creds" \
                "PayFast__MerchantId=secretref:payfast-merchant-id" \
                "PayFast__MerchantKey=secretref:payfast-merchant-key" \
                "PayFast__PassPhrase=secretref:payfast-passphrase" \
                "PayFast__CancelUrl=secretref:payfast-cancelurl" \
                "PayFast__NotifyUrl=secretref:payfast-notifyurl" \
                "PayFast__SandboxUrl=secretref:payfast-sandboxurl" \
                "PayFast__ReturnUrl=secretref:payfast-returnurl"  \
                "Azure__SignalR__ConnectionString=secretref:signalr-conn" \
                "Clip__BaseUrl=$CLIP_BASE_URL"
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend green revision
        id: front_rev
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          VITE_API_URL_STAGING: ${{ secrets.VITE_API_URL_STAGING }}
          FIREBASE_API_KEY: ${{secrets.VITE_FIREBASE_API_KEY}}
          FIREBASE_AUTH_DOMAIN: ${{secrets.VITE_FIREBASE_AUTH_DOMAIN}}
          FIREBASE_PROJECT_ID: ${{secrets.VITE_FIREBASE_PROJECT_ID}}
          FIREBASE_SENDER_ID: ${{secrets.VITE_FIREBASE_SENDER_ID}}
          FIREBASE_APP_ID: ${{secrets.VITE_FIREBASE_APP_ID}}
          FIREBASE_VAPID_KEY: ${{secrets.VITE_FIREBASE_VAPID_KEY}}
        run: |
          SUFFIX="g${IMAGE_TAG:0:7}-${{github.run_attempt}}"
          az containerapp update \
              --name "$FRONTEND_APP" --resource-group "$FRONTEND_RG" \
              --image "$ACR_REGISTRY/unitrade-frontend:${IMAGE_TAG}" \
              --revision-suffix "$SUFFIX" \
              --set-env-vars \
              "VITE_API_URL=$VITE_API_URL_STAGING" \
              "FIREBASE_API_KEY=$FIREBASE_API_KEY" \
              "FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN" \
              "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" \
              "FIREBASE_SENDER_ID=$FIREBASE_SENDER_ID" \
              "FIREBASE_APP_ID=$FIREBASE_APP_ID" \
              "FIREBASE_VAPID_KEY=$FIREBASE_VAPID_KEY"
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
      - name: Wait for backend revision to be Running
        run: |
          az containerapp revision show \
          --name "$BACKEND_APP" --resource-group "$BACKEND_RG" \
          --revision "${BACKEND_APP}--${{ steps.backend_rev.outputs.suffix }}" \
          --query "properties.healthState" -o tsv
      - name: Health check staging backend (green)
        run: |
          FQDN=$(az containerapp revision show \
          --name "$BACKEND_APP" --resource-group "$BACKEND_RG" \
          --revision "${BACKEND_APP}--${{ steps.backend_rev.outputs.suffix }}" \
           --query "properties.fqdn" -o tsv)
          for _ in $(seq 1 10); do
             if curl -fsS "https://$FQDN/health"; then exit 0; fi
             sleep 7
          done
          echo "Health check failed" && exit 1
      - name: Shift traffic to green (backend)
        run: |
          az containerapp ingress traffic set \
          --name "$BACKEND_APP" --resource-group "$BACKEND_RG" \
          --revision-weight "${BACKEND_APP}--${{ steps.backend_rev.outputs.suffix }}=100"

      - name: Shift traffic to green (frontend)
        run: |
          az containerapp ingress traffic set \
          --name "$FRONTEND_APP" --resource-group "$FRONTEND_RG" \
          --revision-weight "${FRONTEND_APP}--${{ steps.front_rev.outputs.suffix }}=100"

      - name: Smoke test staging
        env:
          API_URL: ${{ secrets.VITE_API_URL_STAGING }}
        run: |
          curl -fsS "$API_URL/health" > /dev/null
      
      - name: Rollback to previous revisions (failure event)
        if: failure()
        run: |
          set +e

          BACK_LIVE="${{ steps.live_revs.outputs.backend_live }}"
          FRONT_LIVE="${{ steps.live_revs.outputs.frontend_live }}"

          BACK_SUFFIX="${{ steps.backend_rev.outputs.suffix }}"
          BACK_GREEN="${BACKEND_APP}--${{steps.backend_rev.outputs.suffix}}"
          FRONT_SUFFIX="${{ steps.front_rev.outputs.suffix }}"
          FRONT_GREEN="${FRONTEND_APP}--${{steps.front_rev.outputs.suffix}}"

          if [ -n "$BACK_LIVE" ]; then
            echo "Rolling backend back to $BACK_LIVE"

            az containerapp ingress traffic set \
              --name "$BACKEND_APP" \
              --resource-group "$BACKEND_RG" \
              --revision-weight "${BACK_LIVE}=100"
            
              if [ -n "$BACK_SUFFIX" ] && [ "$BACK_GREEN" != "$BACK_LIVE" ]; then
                az containerapp revision deactivate \
                  --name "$BACKEND_APP" \
                  --resource-group "$BACKEND_RG" \
                  --revision "$BACK_GREEN"
              fi
          else
            echo "No previous backend revision found."
          fi

          if [ -n "$FRONT_LIVE" ]; then
            echo "Rolling frontend back to $FRONT_LIVE"

            az containerapp ingress traffic set \
              --name "$FRONTEND_APP" \
              --resource-group "$FRONTEND_RG" \
              --revision-weight "${FRONT_LIVE}=100"
            
              if [ -n "$FRONT_SUFFIX" ] && [ "$FRONT_GREEN" != "$FRONT_LIVE" ]; then
                az containerapp revision deactivate \
                  --name "$FRONTEND_APP" \
                  --resource-group "$FRONTEND_RG" \
                  --revision "$FRONT_GREEN"
              fi
          else
            echo "No previous frontend revision found."
          fi

      - name: Rollback migrations
        if: failure()
        working-directory: src/backend/Api
        env:
          ConnectionStrings__DefaultConnection: ${{secrets.DB_CONNECTION_STRING_STAGING}}
          Acs__ConnectionString: ${{secrets.Acs__ConnectionString}}
        run:  |
          TARGET="${{ steps.last_migration.outputs.last_migration}}"
          if [ -n "$TARGET" ]; then
            echo "rolling back db to migration: $TARGET"
            dotnet ef database update "$TARGET" --project ../Infrastructure --startup-project .
          else
            echo "no prior migration captured(this is skipping rb)"
          fi

      - name: Deactivate old backend revisions
        run: |
          az containerapp revision list --name "$BACKEND_APP" --resource-group "$BACKEND_RG" \
          --query "[?properties.trafficWeight==\`0\`].name" -o tsv | \
          while read -r rev; do
            [ -n "$rev" ] && az containerapp revision deactivate --name "$BACKEND_APP" --resource-group "$BACKEND_RG" --revision "$rev"
          done
      - name: Deactivate old frontend revisions
        run: |
          az containerapp revision list --name "$FRONTEND_APP" --resource-group "$FRONTEND_RG" \
          --query "[?properties.trafficWeight==\`0\`].name" -o tsv | \
          while read -r rev; do
           [ -n "$rev" ] && az containerapp revision deactivate --name "$FRONTEND_APP" --resource-group "$FRONTEND_RG" --revision "$rev"
          done

  approval-gate:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production-approval
    steps:
      - run: echo "Approved for production deploy"

  deploy-prod:
    permissions:
      id-token: write
      contents: read
    needs: [build-and-push, approval-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
      BACKEND_RG: rg-devnexus-prod
      FRONTEND_RG: rg-devnexus-prod
      BACKEND_APP: ca-backend-prod
      FRONTEND_APP: ca-frontend-prod
      CLIP_RG: rg-devnexus-prod
      CLIP_APP: ca-clip-prod
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Login to Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_PROD }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_PROD }}

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "10.0.x"

      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef

      - name: restore dependencies
        run: dotnet restore UniTrade.sln

      - name: Capture last migration
        id: last_migration
        working-directory: src/backend/Api
        env:
          ConnectionStrings__DefaultConnection: ${{secrets.DB_CONNECTION_STRING_PROD}}
        run:  |
          LAST=$(dotnet ef migrations list --project ../Infrastructure --startup-project . --no-build 2>/dev/null | grep -v '(Pending)' | tail -n 1 | xargs)
          echo "last_migration=$LAST" >> "$GITHUB_OUTPUT"
          echo "Last applied migration: $LAST"

      - name: Backup db before migration(prod)
        id: db_backup
        working-directory: src/backend/Api
        env:
          PGCONN: ${{ secrets.DB_CONNECTION_STRING_PROD}}
        run:  |
          trap 'rm -f ~/.pgpass' EXIT
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

          HOST=$(echo "$PGCONN" | grep -oP '(?i)(?<=Host=)[^;]+')
          PORT=$(echo "$PGCONN" | grep -oP '(?i)(?<=Port=)[^;]+' || echo 5432)
          DBNAME=$(echo "$PGCONN" | grep -oP '(?i)(?<=Database=)[^;]+')
          PGUSER=$(echo "$PGCONN" | grep -oP '(?i)(?<=Username=)[^;]+')
          PGPASS=$(echo "$PGCONN" | grep -oP '(?i)(?<=Password=)[^;]+')

          if [ -z "$HOST" ] || [ -z "$DBNAME" ] || [ -z "$PGUSER" ] || [ -z "$PGPASS" ]; then
            echo "::error:: Failed to parse on or more fields from the connection string.Aborting backup."
            exit 1
          fi

          echo "${HOST}:${PORT}:${DBNAME}:${PGUSER}:${PGPASS}" > ~/.pgpass 
          chmod 600 ~/.pgpass

          pg_dump -h "$HOST" -p "$PORT" -U "$PGUSER" -d "$DBNAME" -Fc -f pre_migration_backup.pg_dump
          DUMP_STATUS=$?

          rm -f ~/.pgpass

          if [ "$DUMP_STATUS" -ne 0 ]; then
            echo "::error::pg_dump failed with exit code $DUMP_STATUS"
            exit 1
          fi

          echo "Backup created successfully."

      - name: Upload db to backup artifact(prod)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-prod-${{ github.sha }}-${{ github.run_attempt }}
          path: src/backend/Api/pre_migration_backup.pg_dump
          retention-days: 30

      - name: Run migrations (prod)
        working-directory: src/backend/Api
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION_STRING_PROD }}
          Acs__ConnectionString: ${{ secrets.Acs__ConnectionString }}
        run: dotnet ef database update --project ../Infrastructure --startup-project .
      
      - name: Capture current live revisions 
        id: live_revs
        run: |
          BACK_LIVE=$(az containerapp revision list \
              --name "$BACKEND_APP" --resource-group "$BACKEND_RG" \
              --query "[?properties.trafficWeight>\`0\`].name | [0]" -o tsv)

              FRONT_LIVE=$(az containerapp revision list \
                --name "$FRONTEND_APP" --resource-group "$FRONTEND_RG" \
                --query "[?properties.trafficWeight>\`0\`].name | [0]" -o tsv)

              echo "backend_live=$BACK_LIVE" >> "$GITHUB_OUTPUT"
              echo "frontend_live=$FRONT_LIVE" >> "$GITHUB_OUTPUT"

              echo "Backend live: ${BACK_LIVE:-<none>}"
              echo "Frontend live: ${FRONT_LIVE:-<none>}"

      - name: Deploy CLIP 
        env: 
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: |
          az containerapp update \
            --name "$CLIP_APP" --resource-group "$CLIP_RG" \
            --image "$ACR_REGISTRY/unitrade-clip:${IMAGE_TAG}"
      
      - name: Get CLIP internal FQDN
        id: clip_fqdn
        run: |
          FQDN=$(az containerapp show \
            --name "$CLIP_APP" --resource-group "$CLIP_RG" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"

      - name: Deploy backend green revision
        id: backend_rev
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          DB_CONN: ${{ secrets.DB_CONNECTION_STRING_PROD }}
          ACS_CONN: ${{secrets.Acs__ConnectionString}}
          JWT_SECRET: ${{secrets.JWT_Secret}}
          OTP_SECRET: ${{secrets.OTP_SECRET}}
          FIREBASE_CREDS: ${{secrets.FIREBASE_CREDENTIALS}}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          ACS_SENDER_ADDRESS: ${{ secrets.ACS_SENDER_ADDRESS }}
          PAYFAST__PASSPHRASE: ${{ secrets.PAYFAST__PASSPHRASE }}          
          PAYFAST__MERCHANTKEY: ${{ secrets.PAYFAST__MERCHANTKEY }}          
          PAYFAST__MERCHANTID: ${{ secrets.PAYFAST__MERCHANTID }}          
          PAYFAST__CANCELURL: ${{ secrets.PAYFAST__CANCELURL }}          
          PAYFAST__NOTIFYURL: ${{ secrets.PAYFAST__NOTIFYURL }}          
          PAYFAST__SANDBOXURL: ${{ secrets.PAYFAST__SANDBOXURL }}
          PAYFAST__RETURNURL: ${{ secrets.PAYFAST__RETURNURL }}
          SIGNALR_CONN: ${{ secrets.SIGNALR_CONN_STRING_PROD}}
          CLIP_BASE_URL: https://${{ steps.clip_fqdn.outputs.fqdn }}
        run: |
          SUFFIX="g${IMAGE_TAG:0:7}-${{github.run_attempt}}"

          az containerapp secret set \
            --name "$BACKEND_APP" --resource-group "$BACKEND_RG" \
            --secrets \
              "db-conn=$DB_CONN" \
              "acs-conn=$ACS_CONN" \
              "jwt-secret=$JWT_SECRET" \
              "otp-secret=$OTP_SECRET" \
              "firebase-creds=$(echo "$FIREBASE_CREDS" | jq -c .)" \
              "payfast-passphrase=$PAYFAST__PASSPHRASE" \
              "payfast-merchant-key=$PAYFAST__MERCHANTKEY" \
              "payfast-merchant-id=$PAYFAST__MERCHANTID" \
              "payfast-cancelurl=$PAYFAST__CANCELURL" \
              "payfast-notifyurl=$PAYFAST__NOTIFYURL" \
              "payfast-sandboxurl=$PAYFAST__SANDBOXURL" \
              "payfast-returnurl=$PAYFAST__RETURNURL" \
              "signalr-conn=$SIGNALR_CONN" 
              

          az containerapp update \
              --name "$BACKEND_APP" --resource-group "$BACKEND_RG" \
              --image "$ACR_REGISTRY/unitrade-backend:${IMAGE_TAG}" \
              --revision-suffix "$SUFFIX" \
              --set-env-vars \
                "ConnectionStrings__DefaultConnection=secretref:db-conn" \
                "Acs__ConnectionString=secretref:acs-conn" \
                "Jwt__Secret=secretref:jwt-secret" \
                "Otp__Secret=secretref:otp-secret" \
                "Cors__AllowedOrigins=$FRONTEND_URL" \
                "Acs__SenderAddress=$ACS_SENDER_ADDRESS" \
                "Firebase__CredentialsJson=secretref:firebase-creds" \
                "PayFast__MerchantId=secretref:payfast-merchant-id" \
                "PayFast__MerchantKey=secretref:payfast-merchant-key" \
                "PayFast__PassPhrase=secretref:payfast-passphrase" \
                "PayFast__CancelUrl=secretref:payfast-cancelurl" \
                "PayFast__NotifyUrl=secretref:payfast-notifyurl" \
                "PayFast__SandboxUrl=secretref:payfast-sandboxurl" \
                "PayFast__ReturnUrl=secretref:payfast-returnurl"  \
                "Azure__SignalR__ConnectionString=secretref:signalr-conn" \
                "Clip__BaseUrl=$CLIP_BASE_URL"
                
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend green revision
        id: front_rev
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          FIREBASE_API_KEY: ${{secrets.VITE_FIREBASE_API_KEY}}
          FIREBASE_AUTH_DOMAIN: ${{secrets.VITE_FIREBASE_AUTH_DOMAIN}}
          FIREBASE_PROJECT_ID: ${{secrets.VITE_FIREBASE_PROJECT_ID}}
          FIREBASE_SENDER_ID: ${{secrets.VITE_FIREBASE_SENDER_ID}}
          FIREBASE_APP_ID: ${{secrets.VITE_FIREBASE_APP_ID}}
          FIREBASE_VAPID_KEY: ${{secrets.VITE_FIREBASE_VAPID_KEY}}
        run: |
          SUFFIX="g${IMAGE_TAG:0:7}-${{github.run_attempt}}"
          az containerapp update \
              --name "$FRONTEND_APP" --resource-group "$FRONTEND_RG" \
              --image "$ACR_REGISTRY/unitrade-frontend:${IMAGE_TAG}" \
              --revision-suffix "$SUFFIX" \
              --set-env-vars \
              "VITE_API_URL=$VITE_API_URL" \
              "FIREBASE_API_KEY=$FIREBASE_API_KEY" \
              "FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN" \
              "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" \
              "FIREBASE_SENDER_ID=$FIREBASE_SENDER_ID" \
              "FIREBASE_APP_ID=$FIREBASE_APP_ID" \
              "FIREBASE_VAPID_KEY=$FIREBASE_VAPID_KEY"
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"

      - name: Health check production backend (green)
        run: |
          FQDN=$(az containerapp revision show \
          --name "$BACKEND_APP" --resource-group "$BACKEND_RG" \
          --revision "${BACKEND_APP}--${{ steps.backend_rev.outputs.suffix }}" \
            --query "properties.fqdn" -o tsv)
          for _ in $(seq 1 10); do
              if curl -fsS "https://$FQDN/health"; then exit 0; fi
              sleep 7
          done
          echo "Health check failed" && exit 1
      - name: Shift traffic to green (backend)
        run: |
          az containerapp ingress traffic set \
          --name "$BACKEND_APP" --resource-group "$BACKEND_RG" \
          --revision-weight "${BACKEND_APP}--${{ steps.backend_rev.outputs.suffix }}=100"

      - name: Shift traffic to green (frontend)
        run: |
          az containerapp ingress traffic set \
          --name "$FRONTEND_APP" --resource-group "$FRONTEND_RG" \
          --revision-weight "${FRONTEND_APP}--${{ steps.front_rev.outputs.suffix }}=100"

      - name: Smoke test prod
        env:
          API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          curl -fsS "$API_URL/health" > /dev/null
      
      - name: Rollback to previous revisions (failure event)
        if: failure()
        run: |
          set +e

          BACK_LIVE="${{ steps.live_revs.outputs.backend_live }}"
          FRONT_LIVE="${{ steps.live_revs.outputs.frontend_live }}"

          BACK_SUFFIX="${{ steps.backend_rev.outputs.suffix }}"
          BACK_GREEN="${BACKEND_APP}--${{steps.backend_rev.outputs.suffix}}"
          FRONT_SUFFIX="${{ steps.front_rev.outputs.suffix }}"
          FRONT_GREEN="${FRONTEND_APP}--${{steps.front_rev.outputs.suffix}}"

          if [ -n "$BACK_LIVE" ]; then
            echo "Rolling backend back to $BACK_LIVE"

            az containerapp ingress traffic set \
              --name "$BACKEND_APP" \
              --resource-group "$BACKEND_RG" \
              --revision-weight "${BACK_LIVE}=100"
            
              if [ -n "$BACK_SUFFIX" ] && [ "$BACK_GREEN" != "$BACK_LIVE" ]; then
                az containerapp revision deactivate \
                  --name "$BACKEND_APP" \
                  --resource-group "$BACKEND_RG" \
                  --revision "$BACK_GREEN"
              fi
          else
            echo "No previous backend revision found."
          fi

          if [ -n "$FRONT_LIVE" ]; then
            echo "Rolling frontend back to $FRONT_LIVE"

            az containerapp ingress traffic set \
              --name "$FRONTEND_APP" \
              --resource-group "$FRONTEND_RG" \
              --revision-weight "${FRONT_LIVE}=100"
            
              if [ -n "$FRONT_SUFFIX" ] && [ "$FRONT_GREEN" != "$FRONT_LIVE" ]; then
                az containerapp revision deactivate \
                  --name "$FRONTEND_APP" \
                  --resource-group "$FRONTEND_RG" \
                  --revision "$FRONT_GREEN"
              fi
          else
            echo "No previous frontend revision found."
          fi

      - name: Rollback migrations
        if: failure()
        working-directory: src/backend/Api
        env:
          ConnectionStrings__DefaultConnection: ${{secrets.DB_CONNECTION_STRING_PROD}}
          Acs__ConnectionString: ${{secrets.Acs__ConnectionString}}
        run:  |
          TARGET="${{ steps.last_migration.outputs.last_migration}}"
          if [ -n "$TARGET" ]; then
            echo "rolling back db to migration: $TARGET"
            dotnet ef database update "$TARGET" --project ../Infrastructure --startup-project .
          else
            echo "no prior migration captured(this is skipping rb)"
          fi

      - name: Deactivate old backend revisions
        run: |
          az containerapp revision list --name "$BACKEND_APP" --resource-group "$BACKEND_RG" \
          --query "[?properties.trafficWeight==\`0\`].name" -o tsv | \
          while read -r rev; do
            [ -n "$rev" ] && az containerapp revision deactivate --name "$BACKEND_APP" --resource-group "$BACKEND_RG" --revision "$rev"
          done
      - name: Deactivate old frontend revisions
        run: |
          az containerapp revision list --name "$FRONTEND_APP" --resource-group "$FRONTEND_RG" \
            --query "[?properties.trafficWeight==\`0\`].name" -o tsv | \
            while read -r rev; do
              [ -n "$rev" ] && az containerapp revision deactivate --name "$FRONTEND_APP" --resource-group "$FRONTEND_RG" --revision "$rev"
            done
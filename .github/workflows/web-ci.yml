name: Web Frontend CI

on:
  workflow_call:
  push:
    branches-ignore: ["dev", "main", "feature/backend/SmartBudget"]
    paths:
      - "src/web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: ["dev","main"]
    paths:
      - "src/web/**"
      - ".github/workflows/web-ci.yml"
concurrency:
  group: web-ci-${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true
jobs:

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: 
          fetch-depth: 0

      - name: Install Gitleaks 
        run: |
          curl -fSL --proto '=https' https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o gitleaks.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin 

      - name: Run Gitleaks scan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gitleaks detect \
              --source . \
              --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
              --config .gitleaks.toml \
              --verbose \
              --redact
          else
            gitleaks detect \
              --source . \
              --log-opts="${{ github.event.before }}..${{ github.sha }}" \
              --config .gitleaks.toml \
              --verbose \
              --redact
          fi
            

  
  build-and-test:
    needs: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    strategy:
      matrix:
        node-version: ["20.x"]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: "src/web/package-lock.json"

      - name: Install dependencies
        working-directory: src/web
        run: npm ci --ignore-scripts

      - name: Lint code
        working-directory: src/web
        run: npm run lint
              
      - name: Set up Java 21 for SonarScanner
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
         java-version: '21'
         distribution: 'temurin'

      - name: Validate frontend env
        working-directory: src/web
        env: 
          VITE_API_URL: ${{secrets.VITE_API_URL}}
        run: |
         : "${VITE_API_URL:?VITE_API_URL is required for frontend build}"
        
      - name: Build application
        working-directory: src/web
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL}}
        run: npm run build

      - name: Run unit tests with coverage
        working-directory: src/web
        run: npm run test:unit:cov

      - name: Run integration tests with coverage
        working-directory: src/web
        run: npm run test:integration:cov
      
      #- name: Upload coverage to Codecov
      #  uses: codecov/codecov-action@v4
      #  with:
      #    files: src/web/coverage/lcov.info
      #    fail_ci_if_error: true
      

      - name: Install SonarScanner
        run: npm install -g @sonar/scan@4.3.0 --ignore-scripts
        
      - name: Run SonarCloud analysis
        working-directory: src/web
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
         export PATH="$JAVA_HOME/bin:$PATH"
         java -version 
         sonar-scanner

  nfr-checks:
      permissions:
       contents: write 
      needs: gitleaks
      runs-on: ubuntu-latest
      timeout-minutes: 15
      steps:
          - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
          - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
            with:
              node-version: "20.x"
              cache: "npm"
              cache-dependency-path: "src/web/package-lock.json"

          - working-directory: src/web
            run: npm ci --ignore-scripts
      
          - name: Dependency audit (QR-03e)
            working-directory: src/web
            run: |
              set -o pipefail
              npm audit --audit-level=high 2>&1 | tee "../../tests/nfr/evidence/Dependency Audits/npm-audit-report.txt"
          
          - name: Upload CVE Report
            if: always()
            uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
            with:
              name: npm-audit-report
              path: "tests/nfr/evidence/Dependency Audits/npm-audit-report.txt"

          - name: Commit audit report
            if: always() && github.event_name == 'push'
            run: |
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add "tests/nfr/evidence/Dependency Audits/"
              git diff --staged --quiet || git commit -m "QR 3e :update npm audit report [skip ci]"
              git push
          - name: Validate Frontend docker image
            working-directory: src/web
            run: docker build -t unitrade-web-ci .
      
          - name: Scan frontend image
            uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 
            with:
             image-ref: unitrade-web-ci
             severity: HIGH,CRITICAL
             exit-code: '1'
             format: table
             output: "tests/nfr/evidence/Container Image Scans/trivy-frontend.txt"
      
          - name: Upload Trivy frontend report
            if: always()
            uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
            with:
                name: trivy-frontend-report
                path: "tests/nfr/evidence/Container Image Scans/trivy-frontend.txt"
                if-no-files-found: ignore

          - name: Commit Trivy report
            if: always() && github.event_name == 'push'
            run: |
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add "tests/nfr/evidence/Container Image Scans/"
              git diff --staged --quiet || git commit -m "QR:update trivy frontend report [skip ci]"
              git push
              


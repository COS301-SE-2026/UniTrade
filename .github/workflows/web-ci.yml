name: Web Frontend CI

on:
  push:
    branches: ["**"]
    paths:
      - "src/web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: ["dev","main"]
    paths:
      - "src/web/**"
      - ".github/workflows/web-ci.yml"

jobs:

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0

      - name: Install Gitleaks 
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin 

      - name: Run Gitleaks scan
        run: gitleaks detect --source . --verbose --redact

  
  build-and-test:
    needs: gitleaks
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: ["20.x"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: "src/web/package-lock.json"

      - name: Install dependencies
        working-directory: src/web
        run: npm ci --ignore-scripts

      - name: Lint code
        working-directory: src/web
        run: npm run lint

       - name: Validate frontend env
        working-directory: src/web
        env: 
          VITE_API_URL: ${{secrets.VITE_API_URL}}
        run: |
         : "${VITE_API_URL:?VITE_API_URL is required for frontend build}"
        
      - name: Build application
        working-directory: src/web
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL}}
        run: npm run build

      - name: Run unit tests with coverage
        working-directory: src/web
        run: npm run test:run -- --coverage
      
      - name: Validate Frontend docker image
        working-directory: src/web
        run: docker build -f src/web/Dockerfile -t unitrade-web-ci .

      - name: Install SonarScanner
        run: npm install -g sonarqube-scanner@3.1.0 --ignore-scripts
        
      - name: Run SonarCloud analysis
        working-directory: src/web
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: sonar-scanner

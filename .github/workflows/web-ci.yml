name: Web Frontend CI

on:
  workflow_call:
  push:
    branches-ignore: ["dev", "main"]
    paths:
      - "src/web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: ["dev","main"]
    paths:
      - "src/web/**"
      - ".github/workflows/web-ci.yml"
concurrency:
  group: web-ci-${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true
jobs:

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: 
          fetch-depth: 0

      - name: Install Gitleaks 
        run: |
          curl -fSL --proto '=https' https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o gitleaks.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin 

      - name: Run Gitleaks scan
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --redact

  
  build-and-test:
    needs: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    strategy:
      matrix:
        node-version: ["20.x"]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: "src/web/package-lock.json"

      - name: Install dependencies
        working-directory: src/web
        run: npm ci --ignore-scripts

      - name: Lint code
        working-directory: src/web
        run: npm run lint
      
      - name: Dependency audit (QR-03e)
        working-directory: src/web
        run: npm audit --audit-level=high
        
      - name: Set up Java 21 for SonarScanner
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
         java-version: '21'
         distribution: 'temurin'

      - name: Validate frontend env
        working-directory: src/web
        env: 
          VITE_API_URL: ${{secrets.VITE_API_URL}}
        run: |
         : "${VITE_API_URL:?VITE_API_URL is required for frontend build}"
        
      - name: Build application
        working-directory: src/web
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL}}
        run: npm run build

      - name: Run unit tests with coverage
        working-directory: src/web
        run: npm run test:unit:cov

      - name: Run integration tests with coverage
        working-directory: src/web
        run: npm run test:integration:cov
      
      #- name: Upload coverage to Codecov
      #  uses: codecov/codecov-action@v4
      #  with:
      #    files: src/web/coverage/lcov.info
      #    fail_ci_if_error: true
      
      - name: Validate Frontend docker image
        working-directory: src/web
        run: docker build -t unitrade-web-ci .

      - name: Install SonarScanner
        run: npm install -g @sonar/scan@4.3.0 --ignore-scripts
        
      - name: Run SonarCloud analysis
        working-directory: src/web
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
         export PATH="$JAVA_HOME/bin:$PATH"
         java -version 
         sonar-scanner

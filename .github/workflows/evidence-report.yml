name: NFR Evidence report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/nfr/traceability.yml"
      - "tests/nfr/evidence/**"
      - "tests/nfr/render_evidence.py"
      - ".github/workflows/evidence-report.yml"

permissions:
  contents: write

concurrency:
  group: nfr-evidence
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Render stamped evidence report
        run: python tests/nfr/render_evidence.py

      - name: Attach report to this run (immutable copy)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfr-evidence-report
          path: |
            tests/nfr/EVIDENCE.md
            tests/nfr/evidence/SHA256SUMS
          if-no-files-found: error

      - name: Commit stamped report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/nfr/EVIDENCE.md tests/nfr/evidence/SHA256SUMS
          if git diff --cached --quiet; then
            echo "No evidence changes to commit."
          else
            git commit -m "docs(nfr): regenerate stamped evidence report [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
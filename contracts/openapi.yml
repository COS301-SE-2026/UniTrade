openapi: 3.0.3
info:
  title: UniTrade Admin & Disputes Api
  version: 0.1.0-demo3
servers:
  - url: /api/v1
security:
  - bearerAuth: []

paths:
  /admin/cases:
    get:
      summary: List pending cases,oldest first
      parameters:
        - {name: type, in: query, schema: {$ref: '#components/schema/CaseType'}}
        - {name: status, in: query, schema: {type: string, default: pending}}
        - {name: sort, in: query, schema: { type: string, default: age}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/CaseSummary'}}

  /admin/cases/{id}:
    get:
      summary: One case with its evidence
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CaseDetail'}

  /admin/cases/{id}/decision:
    post:
      summary: Decide a case (also notifies the subject and writes an audit entry)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest'}
      responses:
        '200':
          description: Updated case
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CaseDetail'}

  /admin/cases/{id}/document:
    get:
      summary: Download a case's proof-of-registration document
      parameters:
        - {name: id, in: path,required: true, schema: {type: string,format: uuid}}
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '404':
          description: Not found
  
  /admin/users/{userId}/reputation:
    get:
      summary: Get a user's reputation summary, including strikes
      parameters:
        - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserReputationDto'}
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string, example: user_not_found}

  /admin/users:
    get:
      summary: List users, filterable by verification status/strikes/search term
      parameters:
        - {name: verificationStatus, in: query, schema: {type: string}}
        - {name: hasStrikes, in: query, schema: {type: boolean}}
        - {name: search, in: query, schema:{ type: string}}
        - {name: page, in: query, schema:{ type: integer, default: 1, minimum: 1}}
        - {name: limit, in: query, schema:{ type: integer, default: 20, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListUsersResponseDto'}
  /admin/ping:
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
            schema:
              type: object
              properties:
                ok: {type: boolean}

  /saved-searches:
    post: 
      summary: Create a saved search
      requestBody:
        required: true
        content: 
          application/json:
            schema: {$ref: "#/components/schemas/CreateSavedSearchDto"}
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SavedSearchDto'}
    get:
      summary: List the caller's saved searches
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/SavedSearchDto'}}
  
  /saved-searches/{id}:
    delete:
      summary: Delete a saved search owned by the caller
      parameters:
        - {name:  id, in: path,required: true, schema: {type: string, format: uuid}}
      responses:
        '204':
          description:  Deleted
        '404':
          description: Not Found

  /saved-searches/{id}/listings:
    get:
      summary: get listings currently matching a saved search
      parameters:
        - {name: searchId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/UserListingDto'}}
        '404':
          description: Saved search not found or not owned by the caller
          content:
            application/json:
              schema:
                type: object
                properties: 
                  error: {type: string}


  /admin/audit:
    get:
      summary: Audit entries
      parameters:
      - {name: entityId, in: query, schema: {type: string}}
      - {name: actorId, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AuditEntry'}}

  /admin/users/{userId}/listings:
    get:
      summary: List a user's listings
      parameters:
      - {name: userId, in: query,required: true, schema: {type: string, format: uuid}}
      - {name: limit, in: query, schema: {type: integer, default: 10, minimum: 1, maximum: 50}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/UserListingDto'}}

  /disputes:
    post:
      summary: File a dispute (any type, including a user-raised no-show)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FileDispute'}
      responses:
        '201':
          description: Case created
          content:
            application/json:
              schema: 
                type: object
                properties:
                  caseId: {type: string, format: uuid}

  /reservations/{reservationId}/snapshot:
    get:
      summary: The listing as it was when this reservation was made
      parameters:
        - { name: reservationId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListingSnapshot'}

  /listings/{id}/publish:
    post:
      summary: Publish a listing (existing endpoint; now requires a verified seller)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Published}
        '403':
          description: seller is not verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string, example: SELLER_NOT_VERIFIED}

components:
  securitySchema:
    bearerAuth: {type: http, schema: bearer, bearerFormat: JWT}
  schemas:
    CaseType:
      type: string
      enum: [verification, listing_quality, report_listing, no_show]

    CaseDecision:
      type: string
      enum: [approve,reject, uphold,dismiss,request_info]

    Outcome:
      type: string
      enum: [strike, remove_listing, refusal_flag]

    CaseSummary:
      type: object
      properties:
        caseId: { type: string, format: uuid}
        type: {$ref: '#/components/schemas/CaseType'}
        status: {type: string}
        subjectUserId: {type: string, format: uuid}
        submittedAt: {type: string, format: date-time}
        ageHours: {type: number}
        slaHours: {type: integer}
        slaBreached: {type: boolean}
        title: {type: string, nullable: true}
        subjectInitials: {type: string, nullable: true}
        counterpartyInitials: {type: string, nullable: true}
        raisedBy: {type: string, format: uuid}
        buyerId: {type: string, format: uuid, nullable: true}
        sellerId: {type: string, format: uuid, nullable: true}
        reservationId: {type: string, format: uuid, nullable: true}
        subjectName: {type: string, nullable: true}
        subjectDegree: {type: string, nullable: true}
        hasDocument: {type: boolean}

    CaseDetail:
      allOf:
        - $ref: '#/components/schemas/CaseSummary'
        - type: object
          properties:
            subject: {$ref: '#/components/schemas/PartySummary'}
            counterParty: {$ref: '#/components/schema/PartySummary'}
            evidence: {$ref: '#/components/schemas/Evidence'}
            history: {type: array, items: {type: object}}
            filedByUserId: {type: string, format: uuid, nullable: true}
            filedByRole: {type: string}

    PartySummary:
      type: object
      properties:
        userId: {type: string, format: uuid}
        name: {type: string}
        initials: {type: string}
        faculty: {type: string, nullable: true}
        reviewAverage: {type: number}
        reputationScore: {type: number}
        strikeCount: {type: integer}

    CaseEvidence:
      type: object
      properties:
        university: {type: string, nullable: true}
        degree: {type: string, nullable: true}
        year: {type: integer, nullable: true}
        email: {type: string,nullable: true}
        domainValid: {type: boolean, nullable: true}
        snapshot: {$ref: '#/components/schemas/ListingSnapshot'}
        buyerPhotos: {type: array, items: {type: string}, nullable: true}
        sellerRefusedPhotos: {type: boolean, nullable: true}
        listingId: {type: string, format: uuid, nullable: true}
        reportReason: {type: string, nullable: true}

        meetupId: {type: integer, nullable: true, description: "int,not uuid, same Meetup.MeetupId mismatch as elsewhere"}
        buyerCheckIn: {type: boolean, nullable: true}
        buyerCheckInTime: {type: string, format: date-time, nullable: true}
        sellerCheckIn: {type: boolean, nullable: true}
        sellerCheckInTime: {type: string, format: date-time, nullable: true}
        pinStatus: {type: string, nullable: true}
        checkInWindowClosesAt: {type: string, format: date-time, nullable: true}

    VerificationEvidence:
      type: object
      properties:
        university: {type: string}
        degree: {type: string}
        year: {type: integer}
        email: {type: string}

    ListingQualityEvidence:
      type: object
      properties:
        snapshot: {$ref: '#/components/schemas/ListingSnapshot'}
        photos: {type: array, items: {type: string}}
        sellerRefusedPhotos: {type: boolean}

    ReportListingEvidence:
      type: object
      properties:
        listingId: {type: string, format: uuid}
        reportReason: {type: string }
        snapshot: {$ref: '#/components/schemas/ListingSnapshot'}

    NoShowEvidence:
      type: object
      properties:
        meetupId: { type: integer}
        buyerCheckedIn: { type: boolean}
        sellerCheckedIn: { type: boolean}
        pinStatus: {type: string, nullable: true}

    DecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: {$ref: '#/components/schemas/CaseDecision'}
        outcome:
          type: array
          items: {$ref: '#/components/schemas/Outcome'}
        reason: {type: string}

    FileDispute:
      type: object
      required: [type]
      properties:
        type: {$ref: '#/components/schemas/CaseType'}
        reservationId: 
          type: string
          format: uuid
          description: "Required for listing_quality and no_show.No_show resolves its meetup via this field, not meetupId."
        listingId: {type: string, format: uuid, description: "Required for report_listing"}
        meetupId: 
          type: string
          format: uuid
          nullable: true
          description: "Currently unused by the filing implementation, no_show resolves the meetup via reservationId instead. Confirm with BE2 whether this field should be removed from the contract."
        photos: 
          type: array 
          items: {type: string}
          description: "Required for listing_quality unless sellerRefusedPhotos is true"
        sellerRefusedPhotos: {type: boolean}
        description: {type : string, description: "Also carries the report reason for report_listing"}

    ListingSnapshot:
      type: object
      properties:
        reservationId: {type: string, format: uuid}
        listingId: {type: string, format: uuid}
        title: {type: string}
        price: {type: number}
        condition: {type: string}
        photoRefs: {type: array, items: {type: string}}
        courseTags: {type: array, items: {type: string}}
        capturedAt: {type: string, format: date-time}
        description: {type: string}

    Strike:
      type: object
      properties: 
        userId: {type: string, format: uuid}
        sourceCaseId: {type: string,format: uuid, nullable: true}
        type: {type: string}
        reason: {type: string}
        createdByAdminId: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        strikeId: {type: string, format: uuid}

    AuditEntry:
      type: object
      properties:
        logId: {type: integer, format: int64, description: "AuditLog.LogId is a bigint, not a uuid"}
        actorId: { type: string, format: uuid,nullable: true}
        action: {type: string}
        entityId: {type: string}
        entityType: {type: string}
        oldValue: {type: string, nullable: true}
        newValue: {type: string, nullable: true}
        reason: {type: string,nullable: true}
        timestamp: {type: string, format: date-time}

    UserListingDto:
      type: object
      properties:
        listingId: {type: string, format: uuid}
        title:  {type: string}
        status: {type: string}
        price:  {type: number}
        createdAt:  {type: string, format: date-time}
        imageUrl: {type: string, nullable: true}

    UserReputationDto:
      type: object
      properties: 
        userId: {type: string, format: uuid}
        name: {type: string}
        email: {type: string}
        universityName: {type: string}
        degree: {type: string}
        year: {type: integer}
        verificationStatus: {type: string}
        reviewAverage: {type: number}
        reputationScore: {type: number}
        reviewCount: {type: integer}
        strikes: {type: array, items: {$ref: '#/components/schemas/StrikeDto'}}

    StrikeDto:
      type: object
      properties:
        strikeId: {type: string, format: uuid}
        type: {type: string}
        reason: {type: string}
        sourceCaseId: {type: string, format: uuid, nullable: true}
        createdByAdminId: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
    
    ListUsersResponseDto:
      type: object
      properties:
        users: {type: array, items: {$ref: '#/components/schemas/UserListItemDto'}}
        total: {type: integer}

    UserListItemDto:
      type: object
      properties:
        userId: {type: string, format: uuid}
        name: {type: string}
        email: {type: string}
        degree: {type: string}
        year: {type: integer}
        verificationStatus: {type: string}
        reviewAverage: {type: number}
        reputationScore: {type: number}
        strikeCount: {type: integer}
    
    CreateSavedSearchDto:
      type: object
      required: [query]
      properties:
        query: {type: string}
        categoryId: {type: number, nullable: true}
        minPrice: {type: number, nullable: true}
        maxPrice: {type: number, nullable: true}
        courseId: {type: integer, nullable: true}

    SavedSearchDto:
      type: object
      properties:
        searchId: {type: string, format: uuid}
        query: {type: string}
        categoryId: {type: integer, nullable: true}
        minPrice: {type: number, nullable: true}
        maxPrice: {type: number, nullable: true}
        courseId: {type: integer, nullable: true}
        isActive: {type: boolean}


            